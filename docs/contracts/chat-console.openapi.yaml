openapi: 3.1.0
info:
  title: Sprint Crew console API
  version: 0.1.0
  description: |
    Status: Implemented (MVP; console sessions are in-memory). Clarify questions are
    model-generated by the Interpreter on the Work lane (ADR 0013) and degrade to a
    deterministic fallback when the lane is cold.
    Contract for the interactive console
    (docs/contracts/chat-console-api.md, ADR 0012, ADR 0013). Routes are live at
    /v1/console/* alongside the existing /sprint/* and /health API.
    Auth: when CONSOLE_API_TOKEN is set, every /v1/console/* and /sprint/* request
    requires Authorization: Bearer <token>. Empty token disables auth. GET /health
    is exempt. Streaming (SSE/WebSocket): non-goal; clients poll GET session.
security:
  - bearerAuth: []
paths:
  /v1/console/sessions:
    post:
      operationId: createConsoleSession
      summary: Create a console session (with initial_prompt → clarifying or ready)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsoleSessionRequest"
            example:
              mode: code
              initial_prompt: Add a /metrics endpoint with request counters
              repo_url: https://github.com/example/service
              target_language: null
      responses:
        "201":
          description: |
            Session created. With initial_prompt the Interpreter (or fallback) runs
            immediately — status is clarifying or ready, not collecting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              example:
                session_id: cs-7f3a
                mode: code
                status: clarifying
                confirmed: false
                repo_url: https://github.com/example/service
                target_language: null
                messages:
                  - role: user
                    content: Add a /metrics endpoint with request counters
                    timestamp: "2026-07-16T09:00:00+00:00"
                intent: null
                clarify_questions:
                  - question_id: q-scope
                    text: Which part of the repo should change?
                    why_asked: null
                    recommended_suggestion_id: null
                    suggestions:
                      - suggestion_id: s-scope-focused
                        label: Only the files needed for this change
                      - suggestion_id: s-scope-broad
                        label: Related modules too
                        detail: including tests and docs touched by the change
                    allow_custom: true
                clarify_answers: []
                sprint_ref: null
                plan_result: null
                error: null
                created_at: "2026-07-16T09:00:00+00:00"
                updated_at: "2026-07-16T09:00:00+00:00"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}:
    get:
      operationId: getConsoleSession
      summary: Fetch session state (polling endpoint)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/console/sessions/{id}/messages:
    post:
      operationId: postConsoleMessage
      summary: Append a user chat message
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
            example:
              content: It should also cover the backlog endpoints
      responses:
        "200":
          description: Updated session (may transition to clarifying)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}/clarify:
    post:
      operationId: submitClarifyAnswers
      summary: Answer pending clarify questions
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClarifyRequest"
            example:
              answers:
                - question_id: q-scope
                  selected_suggestion_id: s-scope-focused
                  custom_text: null
                - question_id: q-tests
                  selected_suggestion_id: null
                  custom_text: unit tests only, no live tiers
      responses:
        "200":
          description: Updated session (ready once all questions answered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "400":
          description: Unknown question_id, both/neither answer fields, or custom answer where allow_custom is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}/confirm:
    post:
      operationId: confirmConsoleSession
      summary: Explicitly confirm the clarified request (requires status=ready)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session with confirmed=true (status stays ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/console/sessions/{id}/start:
    post:
      operationId: startConsoleRun
      summary: Start the run (requires status=ready and confirmed=true)
      description: |
        mode=code: drives today's from-prompt pipeline; session gains sprint_ref
        (backlog_run_id for GET /sprint/backlog/{run_id}; its session_ids feed
        GET /sprint/session/{session_id}). mode=plan: analysis only; completes
        with plan_result and never ships.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session now running (code) or completed with plan_result (plan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              examples:
                codeModeStarted:
                  summary: mode=code — backlog run dispatched
                  value:
                    session_id: cs-7f3a
                    mode: code
                    status: running
                    confirmed: true
                    repo_url: https://github.com/example/service
                    target_language: null
                    messages: []
                    intent: null
                    clarify_questions: []
                    clarify_answers:
                      - question_id: q-scope
                        selected_suggestion_id: s-scope-focused
                        custom_text: null
                    sprint_ref:
                      backlog_run_id: run-91c2
                      sprint_session_ids: []
                    plan_result: null
                    error: null
                    created_at: "2026-07-16T09:00:00+00:00"
                    updated_at: "2026-07-16T09:05:00+00:00"
                planModeCompleted:
                  summary: mode=plan — analysis only, never ships
                  value:
                    session_id: cs-plan1
                    mode: plan
                    status: completed
                    confirmed: true
                    repo_url: null
                    target_language: null
                    messages:
                      - role: user
                        content: Split metrics work into backlog stories
                        timestamp: "2026-07-16T09:00:00+00:00"
                    intent: null
                    clarify_questions: []
                    clarify_answers: []
                    sprint_ref: null
                    plan_result:
                      summary: "Two stories: metrics endpoint, backlog counters"
                      stories:
                        - title: Expose /metrics with request counters
                          rationale: observability baseline
                        - title: Count backlog endpoint hits
                          rationale: null
                    error: null
                    created_at: "2026-07-16T09:00:00+00:00"
                    updated_at: "2026-07-16T09:05:00+00:00"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not ready or not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                detail: session must be confirmed before start
  /v1/console/sessions/{id}/cancel:
    post:
      operationId: cancelConsoleSession
      summary: Cancel from any non-terminal state
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/console/sessions/{id}/events:
    get:
      operationId: getConsoleEvents
      summary: Console timeline, one monotonic seq cursor per session (polling)
      description: |
        Merged event timeline across every sprint session this console run spawned.
        Poll with since=<last next_seq> to drain new events; each seq is delivered
        exactly once. Transport is polling here; M3 adds an SSE stream with the same
        payload. complete reports whether the session reached a terminal status, not
        whether this page is the last — keep polling until an empty page arrives while
        complete is true.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: since
          in: query
          required: false
          description: Return events with seq strictly greater than this cursor.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: A page of the timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleEventsPage"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Shared CONSOLE_API_TOKEN. Omit the Authorization header when the env is
        empty (auth disabled). GET /health never requires this scheme.
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    NotFound:
      description: Unknown session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
          example:
            detail: Console session not found
    StateConflict:
      description: Action not allowed in the session's current status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
    ValidationError:
      description: Request body failed schema validation (extra=forbid)
      content:
        application/json:
          schema:
            type: object
  schemas:
    ConsoleMode:
      type: string
      enum: [plan, code]
    ConsoleSessionStatus:
      type: string
      enum: [collecting, clarifying, ready, running, completed, failed, cancelled]
    ConsoleMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        timestamp:
          type: string
    ClarifySuggestion:
      type: object
      additionalProperties: false
      required: [suggestion_id, label]
      properties:
        suggestion_id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        detail:
          type: [string, "null"]
        rationale:
          type: [string, "null"]
          description: What this choice costs or buys. Null on fallback questions.
    ClarifyQuestion:
      type: object
      additionalProperties: false
      required: [question_id, text, suggestions]
      properties:
        question_id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        suggestions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClarifySuggestion"
        allow_custom:
          type: boolean
          default: true
        why_asked:
          type: [string, "null"]
          description: The ambiguity that prompted this question. Null on fallback questions.
        recommended_suggestion_id:
          type: [string, "null"]
          description: >-
            The answer the backend would pick if the user said "just decide". When non-null
            it always matches one of this question's suggestion_id values. Null on fallback
            questions.
    ClarifyAnswer:
      type: object
      additionalProperties: false
      description: Exactly one of selected_suggestion_id or custom_text is non-null.
      required: [question_id]
      properties:
        question_id:
          type: string
          minLength: 1
        selected_suggestion_id:
          type: [string, "null"]
        custom_text:
          type: [string, "null"]
    IntentSummary:
      type: object
      additionalProperties: false
      description: >-
        What the Interpreter understood, echoed back so the user can correct it before
        confirming. Null when the deterministic fallback produced the questions.
      required: [restated_goal]
      properties:
        restated_goal:
          type: string
          minLength: 1
        assumptions:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    SprintRunRef:
      type: object
      additionalProperties: false
      description: |
        Progress mapping to the live /sprint/* API: backlog_run_id feeds
        GET /sprint/backlog/{run_id}; sprint_session_ids mirror that run's
        session_ids for GET /sprint/session/{session_id}.
      properties:
        backlog_run_id:
          type: [string, "null"]
        sprint_session_ids:
          type: array
          items:
            type: string
    PlanPreviewStory:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        rationale:
          type: [string, "null"]
    ConsolePlanResult:
      type: object
      additionalProperties: false
      description: Plan-mode outcome — analysis only, never shipped (ADR 0012).
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
        stories:
          type: array
          items:
            $ref: "#/components/schemas/PlanPreviewStory"
    CreateConsoleSessionRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/ConsoleMode"
        initial_prompt:
          type: [string, "null"]
        repo_url:
          type: [string, "null"]
        target_language:
          type: [string, "null"]
          description: Phase 3 language-specialized lanes; pass null for now.
    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    ClarifyRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClarifyAnswer"
    ConsoleSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - mode
        - status
        - confirmed
        - messages
        - clarify_questions
        - clarify_answers
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
          minLength: 1
        mode:
          $ref: "#/components/schemas/ConsoleMode"
        status:
          $ref: "#/components/schemas/ConsoleSessionStatus"
        confirmed:
          type: boolean
          default: false
        repo_url:
          type: [string, "null"]
        target_language:
          type: [string, "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleMessage"
        intent:
          oneOf:
            - $ref: "#/components/schemas/IntentSummary"
            - type: "null"
        clarify_questions:
          type: array
          items:
            $ref: "#/components/schemas/ClarifyQuestion"
        clarify_answers:
          type: array
          items:
            $ref: "#/components/schemas/ClarifyAnswer"
        sprint_ref:
          oneOf:
            - $ref: "#/components/schemas/SprintRunRef"
            - type: "null"
        plan_result:
          oneOf:
            - $ref: "#/components/schemas/ConsolePlanResult"
            - type: "null"
        error:
          type: [string, "null"]
        created_at:
          type: string
        updated_at:
          type: string
    EventType:
      type: string
      description: |
        Closed vocabulary for AgentEvent.event_type. The wire type stays a plain
        string on purpose: an unknown value from a newer backend must render
        generically on the client, never 422. Treat any value not listed here as
        "unknown — render as a generic event", do not reject it.
      enum:
        - session_started
        - vector_indexed
        - vector_index_skipped
        - pre_search
        - plan_created
        - plan_aborted
        - tool_call
        - code_change
        - plan_coverage_incomplete
        - skipped
        - tests_added
        - review_complete
        - gate_result
        - retry_prepared
        - awaiting_human
        - failed
        - shipped
        - shipped_stub
        - approved
    AgentEvent:
      type: object
      additionalProperties: false
      required: [timestamp, agent, event_type, summary, level]
      properties:
        timestamp:
          type: string
        agent:
          type: string
          minLength: 1
        event_type:
          allOf:
            - $ref: "#/components/schemas/EventType"
          description: One of EventType; unknown future values may appear — render generically.
        summary:
          type: string
          minLength: 1
        detail:
          type: [object, "null"]
          additionalProperties: true
        seq:
          type: [integer, "null"]
          description: Monotonic per console session; null on events not served from the log.
        phase:
          type: [string, "null"]
        level:
          type: string
          enum: [debug, info, warning, error]
          default: info
    ConsoleEventsPage:
      type: object
      additionalProperties: false
      required: [events, next_seq, complete]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"
        next_seq:
          type: integer
          description: Poll again with since=next_seq to fetch the following page.
        complete:
          type: boolean
          description: True once the session is terminal; more pages may still remain.
    ConsoleError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          minLength: 1
