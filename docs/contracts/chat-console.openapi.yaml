openapi: 3.1.0
info:
  title: Sprint Crew console API
  version: 0.1.0
  description: |
    Status: Implemented. Console sessions are durable in SQLite (M1) and reaped after
    CONSOLE_SESSION_TTL_DAYS. Clarify questions are model-generated by the Interpreter
    on the Work lane (ADR 0013) and degrade to a deterministic fallback when the lane
    is cold.
    Contract for the interactive console
    (docs/contracts/chat-console-api.md, ADR 0012, ADR 0013). Routes are live at
    /v1/console/* alongside the existing /sprint/* and /health API.
    Auth: when CONSOLE_API_TOKEN is set, every /v1/console/* and /sprint/* request
    requires Authorization: Bearer <token>, or ?token= as a fallback on any route
    (needed for EventSource, which cannot set headers). Empty token disables auth.
    GET /health is exempt.
    Timeline: GET /events polls a durable, monotonically sequenced log (M2) and
    GET /stream serves the same events over SSE with Last-Event-ID resume (M3).
    Runs are queued one at a time and cancellable (M5, ADR 0014).
# Either scheme satisfies any route: api/auth.py accepts ?token= everywhere, not just on
# the SSE stream, so a generated client should treat both as valid globally.
security:
  - bearerAuth: []
  - tokenQueryAuth: []
paths:
  /v1/console/sessions:
    post:
      operationId: createConsoleSession
      summary: Create a console session (with initial_prompt → clarifying or ready)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsoleSessionRequest"
            example:
              mode: code
              initial_prompt: Add a /metrics endpoint with request counters
              repo_url: https://github.com/example/service
              target_language: null
      responses:
        "201":
          description: |
            Session created. With initial_prompt the Interpreter (or fallback) runs
            immediately — status is clarifying or ready, not collecting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              example:
                session_id: cs-7f3a
                mode: code
                status: clarifying
                confirmed: false
                repo_url: https://github.com/example/service
                target_language: null
                messages:
                  - role: user
                    content: Add a /metrics endpoint with request counters
                    timestamp: "2026-07-16T09:00:00+00:00"
                intent: null
                clarify_questions:
                  - question_id: q-scope
                    text: Which part of the repo should change?
                    why_asked: null
                    recommended_suggestion_id: null
                    suggestions:
                      - suggestion_id: s-scope-focused
                        label: Only the files needed for this change
                      - suggestion_id: s-scope-broad
                        label: Related modules too
                        detail: including tests and docs touched by the change
                    allow_custom: true
                clarify_answers: []
                sprint_ref: null
                plan_result: null
                error: null
                workspace_status: cloning
                workspace_root: null
                workspace_error: null
                index_status: pending
                index_error: null
                created_at: "2026-07-16T09:00:00+00:00"
                updated_at: "2026-07-16T09:00:00+00:00"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      operationId: listConsoleSessions
      summary: Session history, newest first (M8)
      description: |
        Summaries only — no messages, clarify state or plan results. Fetch one session
        by id for the full object.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: One page of session summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSessionPage"
              example:
                sessions:
                  - session_id: cs-7f3a
                    mode: code
                    status: completed
                    workspace_status: ready
                    title: Add a /metrics endpoint with request counters
                    repo_url: https://github.com/example/service
                    created_at: "2026-07-16T09:00:00+00:00"
                    updated_at: "2026-07-16T09:41:00+00:00"
                total: 1
                next_offset: null
  /v1/console/sessions/{id}:
    get:
      operationId: getConsoleSession
      summary: Fetch session state (polling endpoint)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteConsoleSession
      summary: Delete a session and everything it owns (M8)
      description: |
        Removes the session row, its clone, its diff snapshots and its timeline.
        Refuses while a run is live — cancel first; deleting under a running agent
        would leave it writing into a workspace nobody owns.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session is queued, running or awaiting_review.
  /v1/console/sessions/{id}/messages:
    post:
      operationId: postConsoleMessage
      summary: Append a user chat message and re-interpret
      description: |
        No longer inert outside `collecting` (M9). A message posted while clarifying or
        ready re-runs the Interpreter over the whole conversation, which REPLACES the open
        question set: `clarify_round` increments, `clarify_questions` is a brand new set
        with new round-scoped ids, previously given answers move to `prior_clarifications`,
        and `confirmed` is reset because the confirmation belonged to a different
        understanding of the request.

        Consequences for a client state machine: `ready` can go BACK to `clarifying` — the
        first backwards transition here — `clarify_questions` is not append-only, and an
        answered question can stop being answered. Re-render the clarify form from the
        response rather than merging into what was on screen.

        409 while an ask is in flight: the Interpreter and the Explainer want the same lane.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
            example:
              content: It should also cover the backlog endpoints
      responses:
        "200":
          description: Updated session (may transition to clarifying, in either direction)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}/clarify:
    post:
      operationId: submitClarifyAnswers
      summary: Answer pending clarify questions
      description: |
        Question ids are round-scoped since M9 (`q-{round}-{n}`). Answering an id from a
        superseded round is 409, not 400: the request was correct when it was rendered, and
        the fix is to refetch the session and answer the set that is open now.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClarifyRequest"
            example:
              answers:
                - question_id: q-1-scope
                  selected_suggestion_id: s-1-scope-focused
                  custom_text: null
                - question_id: q-1-tests
                  selected_suggestion_id: null
                  custom_text: unit tests only, no live tiers
      responses:
        "200":
          description: Updated session (ready once all questions answered)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "400":
          description: Unknown question_id, both/neither answer fields, or custom answer where allow_custom is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Session is not clarifying, or the answered question belongs to a superseded
            clarify round — refetch and answer the current one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}/confirm:
    post:
      operationId: confirmConsoleSession
      summary: Explicitly confirm the clarified request (requires status=ready)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session with confirmed=true (status stays ready)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/console/sessions/{id}/start:
    post:
      operationId: startConsoleRun
      summary: Queue the run (requires status=ready and confirmed=true)
      description: |
        Returns 202 in milliseconds: the run is accepted, not performed. Workspace
        clone, vector indexing, context enrichment, the Work-lane load and the
        ScrumMaster call all happen afterward and report on the event stream.

        mode=code: drives today's from-prompt pipeline; session gains sprint_ref
        (backlog_run_id for GET /sprint/backlog/{run_id}; its session_ids feed
        GET /sprint/session/{session_id}). Status is "queued" with queue_position
        when another run holds the single run slot, otherwise "running".

        mode=plan: analysis only, never ships (ADR 0012). BREAKING in M10 — this
        used to complete inside the request and return plan_result. It is now a real
        ScrumMaster (and, at depth=deep, TechLead) run taking the same run slot as a
        code run, so it returns "queued"/"running" with plan_result still null. Watch
        for the plan_complete event and re-read the session, or read plan_run_id.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        description: |
          Optional; the route took no body before M10, so omitting it stays valid.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Run queued or running (both modes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              examples:
                codeModeStarted:
                  summary: mode=code — backlog run dispatched
                  value:
                    session_id: cs-7f3a
                    mode: code
                    status: running
                    confirmed: true
                    repo_url: https://github.com/example/service
                    target_language: null
                    messages: []
                    intent: null
                    clarify_questions: []
                    clarify_answers:
                      - question_id: q-scope
                        selected_suggestion_id: s-scope-focused
                        custom_text: null
                    sprint_ref:
                      backlog_run_id: run-91c2
                      sprint_session_ids: []
                    plan_result: null
                    error: null
                    queue_position: null
                    cancel_requested_at: null
                    created_at: "2026-07-16T09:00:00+00:00"
                    updated_at: "2026-07-16T09:05:00+00:00"
                codeModeQueued:
                  summary: mode=code — another run holds the single run slot
                  value:
                    session_id: cs-9b12
                    mode: code
                    status: queued
                    confirmed: true
                    repo_url: https://github.com/example/service
                    target_language: null
                    messages: []
                    intent: null
                    clarify_questions: []
                    clarify_answers: []
                    sprint_ref:
                      backlog_run_id: run-4de7
                      sprint_session_ids: []
                    plan_result: null
                    error: null
                    queue_position: 1
                    cancel_requested_at: null
                    created_at: "2026-07-16T09:06:00+00:00"
                    updated_at: "2026-07-16T09:06:00+00:00"
                planModeQueued:
                  summary: mode=plan — accepted; the plan arrives on the stream
                  value:
                    session_id: cs-plan1
                    mode: plan
                    status: running
                    confirmed: true
                    repo_url: null
                    target_language: null
                    messages:
                      - role: user
                        content: Split metrics work into backlog stories
                        timestamp: "2026-07-16T09:00:00+00:00"
                    intent: null
                    clarify_questions: []
                    clarify_answers: []
                    sprint_ref: null
                    plan_result: null
                    plan_run_id: plan-3c8e
                    parent_session_id: null
                    error: null
                    queue_position: null
                    cancel_requested_at: null
                    created_at: "2026-07-16T09:00:00+00:00"
                    updated_at: "2026-07-16T09:05:00+00:00"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not ready or not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                detail: session must be confirmed before start
  /v1/console/sessions/{id}/promote:
    post:
      operationId: promoteConsoleSession
      summary: Turn a completed plan into a code run (M10)
      description: |
        Runs the backlog the user just read, without re-clarifying and without
        re-planning: the stored BacklogPlan is handed straight to the pipeline, so
        what executes is what was reviewed.

        Returns a NEW session — a different session_id, mode=code, already confirmed
        and queued, carrying parent_session_id back to the plan. The plan session
        stays "completed" and readable. Navigate to the child; do not keep polling
        the parent expecting it to start running.

        The click is the confirmation, so there is no separate confirm/start step.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202":
          description: Code session created and its run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              example:
                session_id: cs-4b71
                mode: code
                status: running
                confirmed: true
                parent_session_id: cs-plan1
                sprint_ref:
                  backlog_run_id: run-91c2
                  sprint_session_ids: []
                plan_result: null
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Not a plan session, not completed, or the stored backlog is gone (reaped
            or deleted) — plan again before promoting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
              example:
                detail: session is running; promote needs a completed plan
  /v1/console/sessions/{id}/cancel:
    post:
      operationId: cancelConsoleSession
      summary: Cancel from any non-terminal state
      description: |
        Two outcomes, distinguished by the body rather than the status code.

        Nothing started, or the run is still queued: status becomes "cancelled"
        immediately. The run is executing: Stop is accepted — cancel_requested_at
        is set, a cancel_requested event goes out, and status stays "running"
        until the run unwinds at its next checkpoint. The Stop button therefore
        needs a pending state.

        A running cancel cannot be instant: a checkpoint is invisible while a
        subprocess is mid-call, so the worst case is bounded by
        ACCEPTANCE_TEST_TIMEOUT_S and run_command's own timeout.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cancelled, or cancel accepted and pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
              examples:
                cancelledImmediately:
                  summary: Nothing running — terminal at once
                  value:
                    status: cancelled
                    cancel_requested_at: null
                    queue_position: null
                cancelPending:
                  summary: Run executing — stopping at the next checkpoint
                  value:
                    status: running
                    cancel_requested_at: "2026-07-16T09:10:00+00:00"
                    queue_position: null
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/console/sessions/{id}/events:
    get:
      operationId: getConsoleEvents
      summary: Console timeline, one monotonic seq cursor per session (polling)
      description: |
        Merged event timeline across every sprint session this console run spawned.
        Poll with since=<last next_seq> to drain new events; each seq is delivered
        exactly once. GET .../stream serves the same payload over SSE (M3); this
        polling endpoint remains a valid fallback. complete reports whether the session
        reached a terminal status, not whether this page is the last — keep polling
        until an empty page arrives while complete is true.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: since
          in: query
          required: false
          description: Return events with seq strictly greater than this cursor.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: A page of the timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleEventsPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/console/sessions/{id}/stream:
    get:
      operationId: streamConsoleEvents
      summary: Console timeline over Server-Sent Events (SSE)
      description: |
        The same payload as GET .../events, pushed over SSE instead of polled. Each
        event frame carries the full AgentEvent JSON as data, with the SSE id: set to
        the event's seq so the browser resumes automatically. Frames arrive on the
        default message channel — an onmessage handler reads event_type from the body.

        Resume: on reconnect the browser sends Last-Event-ID: <seq> and the server
        replays events with a greater seq from the events table, then continues live —
        no gap, no duplicate. ?since=<seq> is an explicit alternative; Last-Event-ID
        wins when both are present.

        Heartbeat: a ": ping" comment frame every SSE_HEARTBEAT_S seconds (default 15)
        keeps the connection alive through proxies and long GPU silences.

        Termination: when the run is terminal and drained, the server sends a named
        "event: done" frame and closes; the client stops reconnecting.

        Auth: browser EventSource cannot set headers, so this route also accepts the
        token as ?token=<CONSOLE_API_TOKEN> (see tokenQueryAuth).
      security:
        - bearerAuth: []
        - tokenQueryAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: since
          in: query
          required: false
          description: Replay events with seq strictly greater than this. Last-Event-ID wins.
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: token
          in: query
          required: false
          description: CONSOLE_API_TOKEN, for browser EventSource which cannot set headers.
          schema:
            type: string
      responses:
        "200":
          description: An SSE stream of timeline events (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  A sequence of SSE frames. Data frames carry an AgentEvent JSON body
                  and an id: equal to seq; a ": ping" comment is the heartbeat; a final
                  "event: done" frame signals the terminal run.
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/console/sessions/{id}/diff:
    get:
      operationId: getConsoleDiff
      summary: Structured diff for one snapshot — file list, no hunks
      description: |
        Per-file stats for one capture of the workspace, plus every capture this session
        has (available). Hunks are deliberately absent: a change of any size is megabytes
        of hunks and a UI renders a file tree before it renders one file — fetch those per
        file from GET .../diff/{path}.

        Which snapshot: a console session spawns one sprint session per backlog story, and
        each is reviewed up to MAX_REVIEW_RETRIES times, so a run has many. With no query
        parameters this serves the most recently captured one; sprint_session_id + attempt
        address any other.

        A null snapshot is a 200, not a 404 — no diff exists until the first review pass,
        which is most of a run. 404 means the session id is unknown.

        The diff is the working tree against that story's base commit, taken at review time
        each attempt. For story N of a backlog run the base is story N-1's commit, so a
        snapshot describes one story's work, never the run's cumulative change.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/SprintSessionId"
        - $ref: "#/components/parameters/Attempt"
      responses:
        "200":
          description: The requested snapshot (or null) and the list of available ones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleDiffPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/console/sessions/{id}/diff/decisions:
    post:
      operationId: submitDiffDecisions
      summary: Accept or reject files, and release the parked run
      description: |
        The only endpoint that unblocks a running graph (ADR 0015). A run that reached the
        merge gate parks on a human verdict before anything ships; this answers it.

        Decisions accumulate across calls — idempotent per path, last write wins — so a
        half-finished review survives a reload. Only submit: true closes the review, and
        it accepts whatever is still undecided (see review.undecided_paths).

        Reject means feedback, not surgery: the reasons are fed into the existing retry
        loop and the agent redoes those files with the whole tree re-gated. Nothing is
        ever partially committed, and ADR 0010 still holds — this gate sits before the
        PR, it never merges.

        Rejection rounds are budgeted apart from MAX_REVIEW_RETRIES
        (MAX_USER_REJECTION_ROUNDS, default 3); the next rejection after the last round
        ends the run with reason review_budget_exhausted.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiffDecisionsRequest"
      responses:
        "200":
          description: The review after recording, including what is still undecided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffReviewState"
        "400":
          description: A decision names a path that is not in the snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No review is open, or the snapshot addressed is not the open one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/console/sessions/{id}/diff/{path}:
    get:
      operationId: getConsoleFileDiff
      summary: Full hunks for one file in a diff snapshot
      description: |
        The hunks omitted from the file list. Defaults to the same snapshot the bare diff
        route serves; pass sprint_session_id + attempt to read a different one.

        path may contain slashes and is matched against the snapshot's stored paths, which
        are repository-relative and separator-normalised. Percent-encode "#", "?" and "%".

        Binary files carry no hunks at all — binary: true is the whole answer. A file over
        DIFF_MAX_FILE_BYTES is shortened rather than dropped and reports truncated: true,
        with its hunk counts rescoped to the lines it actually carries.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: path
          required: true
          description: Repository-relative path, as listed in the snapshot's files.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/SprintSessionId"
        - $ref: "#/components/parameters/Attempt"
      responses:
        "200":
          description: One file's full diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDiff"
        "404":
          description: Unknown session, no snapshot captured yet, or path not in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
  /v1/console/sessions/{id}/ask:
    post:
      operationId: askConsoleSession
      summary: Ask a question about the repository (M9)
      description: |
        Codebase chat: one read-only Explainer turn against the session's checkout. No
        ticket, no branch, no commit — nothing this produces reaches git.

        Returns 202 immediately. The answer arrives on the SAME event stream as the
        timeline (GET .../stream or .../events), not on a channel of its own, as:

          ask_started -> tool_call* -> answer_delta* -> citation* -> answer_complete

        every event carrying `detail.message_id` — the id of the assistant message this
        response has already appended to `messages`. Render answer_delta chunks as they
        arrive, then REPLACE the bubble with `detail.text` from answer_complete: that
        field is authoritative, the deltas are a preview, and replacing is what makes a
        reconnect (which replays deltas from the log) idempotent. ask_failed ends the
        answer instead; the bubble should show the error, not keep spinning.

        A cold Work lane is minutes, and lane_loading / lane_ready arrive first. Render
        that as a real state — a bare spinner reads as broken. There is deliberately no
        warm-lane policy (ADR 0017).
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "202":
          description: |
            Accepted. The session already carries the question as a user message; the
            assistant message it will be answered into is the last one, and its
            message_id is what the stream's events reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "409":
          description: |
            Not askable right now, and `detail` says which: a run is live in this session
            or any other (the Work lane is single-tenant), the checkout is not ready yet,
            an answer is already being generated, or chat is disabled on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
  /v1/console/sessions/{id}/ask/cancel:
    post:
      operationId: cancelConsoleAsk
      summary: Stop generating the current answer (M9)
      description: |
        Distinct from POST /cancel, which ends the whole session: abandoning a question is
        not a reason to throw away the conversation it was asked in. Cancel is cooperative
        then hard, like a run's (ADR 0014), so expect ask_failed shortly rather than
        immediately.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cancel accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSession"
        "404":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "409":
          description: No answer is being generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
  /v1/console/sessions/{id}/files/{path}:
    get:
      operationId: getConsoleFile
      summary: Read one file from the session's checkout (M9)
      description: |
        What makes a citation a link rather than inert text. Read-only and guarded by the
        same path safety every agent tool goes through, so it cannot read anything a tool
        could not.

        This is the session's checkout — the repository's committed state — not the run's
        working tree. For files a run has changed, use the diff endpoints instead.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: path
          in: path
          required: true
          description: Repository-relative path. Percent-encode "#", "?" and "%".
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The file's contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleFile"
        "400":
          description: Path escapes the workspace or is otherwise unsafe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "404":
          description: Unknown session, or the path is not a file in the checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
        "409":
          description: The session has no ready checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Shared CONSOLE_API_TOKEN. Omit the Authorization header when the env is
        empty (auth disabled). GET /health never requires this scheme.
    tokenQueryAuth:
      type: apiKey
      in: query
      name: token
      description: |
        The same shared CONSOLE_API_TOKEN as bearerAuth, passed as a ?token= query
        parameter. Accepted on every route but intended only for GET .../stream, where
        browser EventSource cannot set an Authorization header. A query-string token
        may appear in access logs — acceptable for this single-user LAN deployment.
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    SprintSessionId:
      name: sprint_session_id
      in: query
      required: false
      description: Select one story's snapshot. Omit for the most recent capture.
      schema:
        type: string
    Attempt:
      name: attempt
      in: query
      required: false
      description: Which review pass of that story. Ignored unless sprint_session_id is set.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    NotFound:
      description: Unknown session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
          example:
            detail: Console session not found
    StateConflict:
      description: Action not allowed in the session's current status
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConsoleError"
    ValidationError:
      description: Request body failed schema validation (extra=forbid)
      content:
        application/json:
          schema:
            type: object
  schemas:
    ConsoleMode:
      type: string
      enum: [plan, code]
    ConsoleSessionStatus:
      type: string
      description: |
        "queued" (M5) means started but waiting for the single run slot; see
        queue_position. A session may also go straight from ready to running when
        nothing is ahead of it, so clients must handle both.

        "awaiting_review" (M7) is non-terminal and blocks on the *user*: the run is alive
        and parked on a per-file verdict. Read ConsoleDiffPage.review for what it wants
        and POST .../diff/decisions to release it. It expires (see review.expires_at),
        after which the run fails; Stop also works while parked.
      enum:
        [
          collecting,
          clarifying,
          ready,
          queued,
          running,
          awaiting_review,
          completed,
          failed,
          cancelled,
        ]
    ConsoleMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        message_id:
          type: string
          minLength: 1
          description: |
            Stable identity for one turn (M9). Every ask_started / answer_delta /
            citation / answer_complete / ask_failed event carries this in `detail`,
            so a client can grow the right bubble when more than one answer exists.
        citations:
          type: array
          items:
            $ref: "#/components/schemas/AnswerCitation"
          description: Only ever populated on an assistant turn produced by an ask (M9).
        timestamp:
          type: string
    AnswerCitation:
      type: object
      additionalProperties: false
      required: [path, source]
      description: |
        Where an answer came from (M9). Derived from the Explainer's tool log and the
        answer's own inline `path:line` references, never asked of the model. Fetch the
        file with GET /v1/console/sessions/{id}/files/{path} to render a link.
      properties:
        path:
          type: string
          minLength: 1
          description: Repository-relative path in the session's checkout.
        start_line:
          type: [integer, "null"]
          minimum: 1
        end_line:
          type: [integer, "null"]
          minimum: 1
        source:
          type: string
          description: |
            Which evidence produced it: "read_file" (the answer opened this file),
            "semantic_search" (it was shown this hit), or "answer" (the prose named a
            path that exists but was not opened). A UI may rank them in that order.
    AskRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
    ConsoleFile:
      type: object
      additionalProperties: false
      required: [path, content, size_bytes]
      properties:
        path:
          type: string
          minLength: 1
        content:
          type: string
          description: UTF-8 with replacement characters; a prefix when truncated is true.
        size_bytes:
          type: integer
          minimum: 0
          description: The file's real size, not the length of `content`.
        truncated:
          type: boolean
          default: false
          description: True when the file exceeded CONSOLE_FILE_MAX_BYTES.
    ClarifySuggestion:
      type: object
      additionalProperties: false
      required: [suggestion_id, label]
      properties:
        suggestion_id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        detail:
          type: [string, "null"]
        rationale:
          type: [string, "null"]
          description: What this choice costs or buys. Null on fallback questions.
    ClarifyQuestion:
      type: object
      additionalProperties: false
      required: [question_id, text, suggestions]
      properties:
        question_id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        suggestions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClarifySuggestion"
        allow_custom:
          type: boolean
          default: true
        why_asked:
          type: [string, "null"]
          description: The ambiguity that prompted this question. Null on fallback questions.
        recommended_suggestion_id:
          type: [string, "null"]
          description: >-
            The answer the backend would pick if the user said "just decide". When non-null
            it always matches one of this question's suggestion_id values. Null on fallback
            questions.
    ClarifyAnswer:
      type: object
      additionalProperties: false
      description: Exactly one of selected_suggestion_id or custom_text is non-null.
      required: [question_id]
      properties:
        question_id:
          type: string
          minLength: 1
        selected_suggestion_id:
          type: [string, "null"]
        custom_text:
          type: [string, "null"]
    IntentSummary:
      type: object
      additionalProperties: false
      description: >-
        What the Interpreter understood, echoed back so the user can correct it before
        confirming. Null when the deterministic fallback produced the questions.
      required: [restated_goal]
      properties:
        restated_goal:
          type: string
          minLength: 1
        assumptions:
          type: array
          items:
            type: string
        unknowns:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
    SprintRunRef:
      type: object
      additionalProperties: false
      description: |
        Progress mapping to the live /sprint/* API: backlog_run_id feeds
        GET /sprint/backlog/{run_id}; sprint_session_ids mirror that run's
        session_ids for GET /sprint/session/{session_id}.
      properties:
        backlog_run_id:
          type: [string, "null"]
        sprint_session_ids:
          type: array
          items:
            type: string
    PlanDepth:
      type: string
      description: |
        How much analysis a plan run does (M10). "quick" is the ScrumMaster only —
        a backlog, tens of seconds on a warm lane. "deep" adds a read-only TechLead
        pass per story for real files_to_touch/steps/acceptance_tests, which is a
        model run each (bounded by the server's backlog story cap).
      enum: [quick, deep]
    PlanPreviewStory:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        rationale:
          type: [string, "null"]
        key:
          type: [string, "null"]
          description: Story key; what `depends_on` and `recommended_first` refer to.
        description:
          type: string
          default: ""
        acceptance_criteria:
          type: string
          default: ""
        priority:
          type: integer
          minimum: 0
          default: 0
        depends_on:
          type: array
          items:
            type: string
        estimated_complexity:
          type: [string, "null"]
          enum: [trivial, simple, complex, null]
        files_to_touch:
          type: array
          items:
            type: string
          description: |
            Empty at "quick" depth — no TechLead ran. Check `ConsolePlanResult.depth`
            before rendering an empty list as "no files affected".
        acceptance_tests:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        planning_mode:
          type: [string, "null"]
          description: |
            Which TechLead ladder produced the detail: template, static or tool_loop.
            A "template" plan is not repo analysis — say so rather than presenting it
            as one.
    ConsolePlanResult:
      type: object
      additionalProperties: false
      description: Plan-mode outcome — analysis only, never shipped (ADR 0012).
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
        stories:
          type: array
          items:
            $ref: "#/components/schemas/PlanPreviewStory"
        depth:
          allOf:
            - $ref: "#/components/schemas/PlanDepth"
          description: Which depth produced this result — i.e. whether a TechLead ran.
        product_brief:
          oneOf:
            - $ref: "#/components/schemas/ProductBrief"
            - type: "null"
        recommended_first:
          type: [string, "null"]
          description: Story key the ScrumMaster would start with.
        generated_at:
          type: string
    ProductBrief:
      type: object
      additionalProperties: false
      required: [title, summary]
      properties:
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        goals:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string
    CreateConsoleSessionRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/ConsoleMode"
        initial_prompt:
          type: [string, "null"]
        repo_url:
          type: [string, "null"]
        target_language:
          type: [string, "null"]
          description: Phase 3 language-specialized lanes; pass null for now.
    StartRunRequest:
      type: object
      additionalProperties: false
      description: |
        Optional body for POST /start (M10). depth applies to plan mode only; a code
        run's depth is the pipeline's business, not the caller's. Omit for the
        server default (CONSOLE_PLAN_DEFAULT_DEPTH, "quick" out of the box).
      properties:
        depth:
          oneOf:
            - $ref: "#/components/schemas/PlanDepth"
            - type: "null"
    PostMessageRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    ClarifyRequest:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ClarifyAnswer"
    ConsoleSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - mode
        - status
        - confirmed
        - messages
        - clarify_questions
        - clarify_answers
        - created_at
        - updated_at
      properties:
        session_id:
          type: string
          minLength: 1
        mode:
          $ref: "#/components/schemas/ConsoleMode"
        status:
          $ref: "#/components/schemas/ConsoleSessionStatus"
        confirmed:
          type: boolean
          default: false
        repo_url:
          type: [string, "null"]
        target_language:
          type: [string, "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleMessage"
        intent:
          oneOf:
            - $ref: "#/components/schemas/IntentSummary"
            - type: "null"
        clarify_questions:
          type: array
          items:
            $ref: "#/components/schemas/ClarifyQuestion"
        clarify_answers:
          type: array
          items:
            $ref: "#/components/schemas/ClarifyAnswer"
        clarify_round:
          type: integer
          minimum: 1
          default: 1
          description: |
            Which round the open questions belong to (M9). A message posted while
            clarifying or ready re-runs the Interpreter, which REPLACES the question
            set and increments this. Question ids are round-scoped (`q-{round}-{n}`),
            so answering an id from a previous round gets 409, not 400 — refetch the
            session and answer the current set. Do not treat `clarify_questions` as
            append-only, and do not assume an answered question stays answered.
        prior_clarifications:
          type: array
          items:
            type: string
          description: |
            Resolved Q&A from superseded rounds, kept as context (M9). Still things
            the user told us, but no longer answers — the questions are gone. Render
            as history, not as a form.
        active_ask_id:
          type: [string, "null"]
          description: The in-flight ask, if any (M9). See `ask_in_flight`.
        ask_in_flight:
          type: boolean
          default: false
          description: |
            True while an answer is being generated (M9). Derived from the server's
            run registry on every read rather than stored, so it is false again after
            a restart that killed the task. Disable the composer while it is true;
            `POST /messages` and `DELETE /sessions/{id}` both 409.
        sprint_ref:
          oneOf:
            - $ref: "#/components/schemas/SprintRunRef"
            - type: "null"
        plan_result:
          oneOf:
            - $ref: "#/components/schemas/ConsolePlanResult"
            - type: "null"
          description: |
            Null until a plan run finishes (M10). Plan mode is asynchronous: `POST
            /start` returns 202 with this still null, and the result arrives with the
            `plan_complete` event. Do not read it off the start response.
        plan_run_id:
          type: [string, "null"]
          description: |
            The plan-mode run in the server's registry (M10). Plan mode has no backlog
            run, so this is what "queued"/"running" refers to for a plan session.
        parent_session_id:
          type: [string, "null"]
          description: |
            Set on a session created by `POST /promote` (M10): the plan session whose
            backlog this code run executes. A sidebar can nest the two.
        error:
          type: [string, "null"]
        queue_position:
          type: [integer, "null"]
          minimum: 1
          description: |
            How many runs must finish before this one starts (M5). Non-null only
            while status is "queued", where it is 1 or more; null once the run is
            admitted or the session ends.
        cancel_requested_at:
          type: [string, "null"]
          description: |
            Set when Stop was accepted but the run has not stopped yet (M5). While
            this is non-null and status is still "running", render a pending state.
        workspace_status:
          allOf:
            - $ref: "#/components/schemas/WorkspaceStatus"
          description: |
            Progress of the session's own checkout (M8). Advances independently of
            `status`: a session is usable while its clone is still arriving, so render
            the two separately rather than folding them into one spinner.
        workspace_root:
          type: [string, "null"]
          description: Absolute server path of the clone; null until it is ready.
        workspace_error:
          type: [string, "null"]
        index_status:
          allOf:
            - $ref: "#/components/schemas/IndexStatus"
          description: |
            Progress of the repository index (M8). "skipped" is not an error — there
            was nothing worth indexing, or indexing is switched off.
        index_error:
          type: [string, "null"]
        contract_version:
          type: integer
          default: 2
          description: |
            Bumped when a breaking change lands, so a client can branch instead of
            flag-daying. 1 = everything up to M9. 2 = plan mode is asynchronous (M10).
        created_at:
          type: string
        updated_at:
          type: string
    WorkspaceStatus:
      type: string
      description: |
        M8. "evicted" means the clone was reclaimed by the workspace LRU: the session
        is still readable, its checkout is gone.
      enum: [pending, cloning, ready, failed, evicted]
    IndexStatus:
      type: string
      enum: [pending, indexing, ready, skipped, failed]
    ConsoleSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, mode, status, workspace_status, created_at, updated_at]
      properties:
        session_id:
          type: string
          minLength: 1
        mode:
          $ref: "#/components/schemas/ConsoleMode"
        status:
          $ref: "#/components/schemas/ConsoleSessionStatus"
        workspace_status:
          $ref: "#/components/schemas/WorkspaceStatus"
        title:
          type: [string, "null"]
          description: First user message, truncated — the session's name in a history list.
        repo_url:
          type: [string, "null"]
        parent_session_id:
          type: [string, "null"]
          description: Set on a promoted code run (M10) — nest it under its plan.
        created_at:
          type: string
        updated_at:
          type: string
    ConsoleSessionPage:
      type: object
      additionalProperties: false
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleSessionSummary"
        total:
          type: integer
        next_offset:
          type: [integer, "null"]
          description: Offset of the next page, or null when this is the last one.
    EventType:
      type: string
      description: |
        Closed vocabulary for AgentEvent.event_type. The wire type stays a plain
        string on purpose: an unknown value from a newer backend must render
        generically on the client, never 422. Treat any value not listed here as
        "unknown — render as a generic event", do not reject it.
      enum:
        - session_started
        - vector_indexed
        - vector_index_skipped
        - pre_search
        - plan_created
        - plan_aborted
        - tool_call
        - code_change
        - plan_coverage_incomplete
        - skipped
        - tests_added
        - review_complete
        - gate_result
        - retry_prepared
        - awaiting_human
        - failed
        - shipped
        - shipped_stub
        - approved
        - lane_loading
        - lane_ready
        - lane_stopped
        - phase_started
        - phase_completed
        - run_queued
        - run_started
        - workspace_ready
        - backlog_planned
        - cancel_requested
        - cancelled
        - diff_updated
        - awaiting_diff_review
        - review_decisions_recorded
        - rejection_recorded
        - diff_review_expired
        - review_budget_exhausted
        - repo_cloning
        - repo_ready
        - repo_failed
        - index_progress
        - index_ready
        - ask_started
        - answer_delta
        - citation
        - answer_complete
        - ask_failed
        - clarify_round_started
        - plan_started
        - story_planned
        - plan_complete
        - plan_failed
        - promoted
    AgentEvent:
      type: object
      additionalProperties: false
      required: [timestamp, agent, event_type, summary, level]
      properties:
        timestamp:
          type: string
        agent:
          type: string
          minLength: 1
        event_type:
          allOf:
            - $ref: "#/components/schemas/EventType"
          description: One of EventType; unknown future values may appear — render generically.
        summary:
          type: string
          minLength: 1
        detail:
          type: [object, "null"]
          additionalProperties: true
        seq:
          type: [integer, "null"]
          description: Monotonic per console session; null on events not served from the log.
        phase:
          type: [string, "null"]
        level:
          type: string
          enum: [debug, info, warning, error]
          default: info
    ConsoleEventsPage:
      type: object
      additionalProperties: false
      required: [events, next_seq, complete]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvent"
        next_seq:
          type: integer
          description: Poll again with since=next_seq to fetch the following page.
        complete:
          type: boolean
          description: True once the session is terminal; more pages may still remain.
    FileAction:
      type: string
      description: |
        Derived from git status --porcelain, which can see the index, rather than from the
        diff header. Renames are reported as a delete plus a create; the pair is not
        modelled, and old_path carries the previous name where git supplied one.
      enum: [created, modified, deleted]
    DiffLine:
      type: object
      additionalProperties: false
      required: [kind, content]
      properties:
        kind:
          type: string
          description: |
            no_newline is git's "\\ No newline at end of file" marker. It is a line rather
            than a flag on the line before it because that is where it sits in the diff.
          enum: [context, add, del, no_newline]
        content:
          type: string
          description: The line without its diff prefix character.
        old_lineno:
          type: integer
          nullable: true
          minimum: 1
          description: Null on a line that does not exist on the old side (an addition).
        new_lineno:
          type: integer
          nullable: true
          minimum: 1
          description: Null on a line that does not exist on the new side (a deletion).
    DiffHunk:
      type: object
      additionalProperties: false
      required: [old_start, old_lines, new_start, new_lines, lines]
      properties:
        old_start:
          type: integer
          minimum: 0
        old_lines:
          type: integer
          minimum: 0
        new_start:
          type: integer
          minimum: 0
        new_lines:
          type: integer
          minimum: 0
        section:
          type: string
          default: ""
          description: The heading git appends after the closing @@, usually the enclosing function.
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DiffLine"
    DiffFileSummary:
      type: object
      additionalProperties: false
      required: [path, action]
      properties:
        path:
          type: string
          minLength: 1
        old_path:
          type: string
          nullable: true
        action:
          $ref: "#/components/schemas/FileAction"
        additions:
          type: integer
          minimum: 0
          default: 0
        deletions:
          type: integer
          minimum: 0
          default: 0
        binary:
          type: boolean
          default: false
          description: Binary files have no hunks; git reports only that they differ.
        truncated:
          type: boolean
          default: false
          description: This file exceeded DIFF_MAX_FILE_BYTES and is served shortened.
    FileDiff:
      type: object
      additionalProperties: false
      required: [path, action]
      description: One file's full diff, as served by GET .../diff/{path}.
      properties:
        path:
          type: string
          minLength: 1
        old_path:
          type: string
          nullable: true
        action:
          $ref: "#/components/schemas/FileAction"
        additions:
          type: integer
          minimum: 0
          default: 0
        deletions:
          type: integer
          minimum: 0
          default: 0
        binary:
          type: boolean
          default: false
        truncated:
          type: boolean
          default: false
        header_lines:
          type: array
          description: |
            The "diff --git" preamble verbatim. Kept so the original bytes can be
            reconstructed; a client rendering a diff view can ignore it.
          items:
            type: string
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"
    WorkspaceDiffSnapshot:
      type: object
      additionalProperties: false
      required: [sprint_session_id, files]
      description: |
        One sprint session's working tree at one review pass. Keyed by
        (sprint_session_id, attempt), not by console session — a console session spawns one
        sprint session per backlog story and each is reviewed repeatedly.
      properties:
        console_session_id:
          type: string
          nullable: true
        sprint_session_id:
          type: string
          minLength: 1
        ticket_key:
          type: string
          default: ""
        attempt:
          type: integer
          minimum: 0
          default: 0
        git_sha:
          type: string
          description: HEAD the diff is against — that story's base commit.
        captured_at:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/DiffFileSummary"
        total_additions:
          type: integer
          minimum: 0
          default: 0
        total_deletions:
          type: integer
          minimum: 0
          default: 0
        truncated:
          type: boolean
          default: false
          description: |
            Whole files were omitted past DIFF_MAX_FILES. Distinct from a file's own
            truncated flag, which means one file was shortened.
    DiffSnapshotRef:
      type: object
      additionalProperties: false
      required: [sprint_session_id, attempt]
      description: One entry in a session's snapshot list — the story/attempt picker.
      properties:
        sprint_session_id:
          type: string
          minLength: 1
        attempt:
          type: integer
          minimum: 0
        ticket_key:
          type: string
        captured_at:
          type: string
        files_changed:
          type: integer
          minimum: 0
        total_additions:
          type: integer
          minimum: 0
        total_deletions:
          type: integer
          minimum: 0
    FileDecision:
      type: object
      additionalProperties: false
      required: [path, decision]
      description: |
        One file's verdict in a human review pass (M7). A reject must carry a reason —
        it is injected verbatim into the next Coder/TechLead prompt, so an empty one is
        a 422 rather than a UI nudge.
      properties:
        path:
          type: string
          minLength: 1
        decision:
          type: string
          enum: [accept, reject]
        reason:
          type: string
          nullable: true
          description: Required when decision is "reject". Ignored (but allowed) on accept.
        decided_at:
          type: string
          description: Server-stamped; a value sent by the client is overwritten.
    DiffReviewState:
      type: object
      additionalProperties: false
      required: [sprint_session_id, attempt, status]
      description: |
        The review blocking a run, or the last one on that snapshot. Follow
        sprint_session_id + attempt rather than "the latest snapshot": on a multi-story
        backlog run each story parks separately, and the two coincide only by luck.
      properties:
        sprint_session_id:
          type: string
          minLength: 1
        attempt:
          type: integer
          minimum: 0
        rejection_round:
          type: integer
          minimum: 0
          description: |
            Rounds already spent when this review opened, against
            MAX_USER_REJECTION_ROUNDS (default 3). The next rejection after the last
            round ends the run with reason review_budget_exhausted.
        status:
          type: string
          description: |
            "expired" means closed without a decision — the timeout lapsed, or the run
            was stopped.
          enum: [pending, decided, expired]
        requested_at:
          type: string
        expires_at:
          type: string
          description: |
            When the park lapses (DIFF_REVIEW_TIMEOUT_S, default 1h). On expiry the run
            fails with reason review_timeout — worth a visible countdown.
        decided_at:
          type: string
          nullable: true
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/FileDecision"
        undecided_paths:
          type: array
          description: |
            Files in the snapshot with no verdict yet. Submitting accepts them, so show
            this count on the submit control rather than burying it.
          items:
            type: string
    DiffDecisionsRequest:
      type: object
      additionalProperties: false
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/FileDecision"
        sprint_session_id:
          type: string
          nullable: true
          description: |
            Which snapshot these are for. Omit for the open review, which is what a
            client following ConsoleDiffPage.review always wants. A mismatch is a 409.
        attempt:
          type: integer
          minimum: 0
          nullable: true
        submit:
          type: boolean
          default: false
          description: |
            Release the run. Without it, decisions are merely saved — which is how a
            half-finished review survives a page reload.
    ConsoleDiffPage:
      type: object
      additionalProperties: false
      required: [snapshot, available]
      properties:
        snapshot:
          allOf:
            - $ref: "#/components/schemas/WorkspaceDiffSnapshot"
          nullable: true
          description: Null until the first review pass captures one. Not an error.
        available:
          type: array
          description: Every snapshot this console session has, oldest capture first.
          items:
            $ref: "#/components/schemas/DiffSnapshotRef"
        review:
          allOf:
            - $ref: "#/components/schemas/DiffReviewState"
          nullable: true
          description: |
            The review blocking the run, if one is open (M7). Null means no action is
            needed from the user — the normal state for most of a run.
    ConsoleError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          minLength: 1
