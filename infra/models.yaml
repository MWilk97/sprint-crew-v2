# Role → lane mapping. Served names must match OpenAI API `model` field.
#
# Rollback coder — Qwen3-Coder-Next NVFP4 (previous production):
#   model_id: gdubicki/Qwen3-Coder-Next-NVFP4-GB10
#   served_name: qwen3-coder-next-nvfp4
#   max_model_len: 131072
#   gpu_memory_utilization: 0.85
#   tool_call_parser: qwen3_coder
#
# Rollback coder baseline (FP8, small context):
#   model_id: Qwen/Qwen3-Coder-Next-FP8
#   served_name: qwen3-coder-next
#   max_model_len: 12288
#   gpu_memory_utilization: 0.78
#
# Rollback work — Qwen3-30B-A3B-Thinking-2507 NVFP4 (previous production, text-only):
#   model_id: NVFP4/Qwen3-30B-A3B-Thinking-2507-FP4
#   served_name: qwen3-30b-a3b-thinking
#   gpu_memory_utilization: 0.50
#   tool_call_parser: hermes
#   requires: scripts/patch_work_quant.py run once after download
#
# gpu_memory_utilization assumes ONE lane loaded at a time (sequential pipeline).
# GX10/GB10 unified memory — per-lane tuning (128 GB unified), NVFP4 weights:
#   coding  Laguna S 2.1 NVFP4 (~72 GB): ~0.85 leaves KV headroom @ 131k
#   work    Qwen3.6-35B-A3B NVFP4 (~22 GB incl. vision tower): ~0.65 covers weights + KV @ 131k
#           (the ~18 GB / ~0.50 figures belong to the rollback ckpt above, not this lane)
# NVFP4 MoE on GB10 (sm121) needs Marlin GEMM env flags — see infra/docker-compose.yml.
# See https://github.com/shamily/vllm-gb10 — do not use 0.95+ like on discrete VRAM GPUs.
lanes:
  coding:
    port: 8001
    base_url: http://127.0.0.1:8001/v1
    # Laguna S 2.1 — 118B MoE / ~8.5B active, NVFP4 (GB10). Sampling pinned to Poolside
    # spec T=0.7/top_p=0.95/top_k=20; thinking OFF by default, escalated per-request from
    # coder attempt 2 (needs --reasoning-parser poolside_v1). See AGENTS.md 8.2/8.4.
    # Requires vLLM >= 0.25.1 with poolside_v1 (coder image override in docker-compose)
    model_id: poolside/Laguna-S-2.1-NVFP4
    served_name: laguna-s-2.1-nvfp4
    max_model_len: 131072
    gpu_memory_utilization: 0.85
    tool_call_parser: poolside_v1
    enable_auto_tool_choice: true
    is_moe: true
    request_limit_multiplier: 1.25

  work:
    port: 8002
    base_url: http://127.0.0.1:8002/v1
    # Work lane — Interpreter (clarify), ScrumMaster (prep), TechLead, Formatter, Reviewer,
    # Tester reporter
    # Qwen3.6-35B-A3B NVFP4 (qwen3_5_moe, ~22 GB, 3B active) — reasoning + tools + vision.
    # Multimodal: the Interpreter is the only role that sends images; everything
    # downstream stays text-only and consumes its derived context (ADR 0013).
    # Runtime tool/reasoning flags: infra/docker-compose.yml (LaneConfig ignores these YAML fields)
    # No quant patch needed — this ckpt declares quant_method: compressed-tensors itself
    # (the old ModelOpt work ckpt did not; that is what scripts/patch_work_quant.py was for).
    model_id: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    served_name: qwen3.6-35b-a3b-nvfp4
    max_model_len: 131072
    gpu_memory_utilization: 0.65
    tool_call_parser: qwen3_coder
    enable_auto_tool_choice: true
    is_moe: true
    supports_vision: true
    request_limit_multiplier: 1.0

embeddings:
  # Apache 2.0 — CPU sidecar (profile vector), not loaded with vLLM lanes
  model_id: jinaai/jina-embeddings-v2-base-code
  port: 8080
  # Optional upgrade (7B, Apache 2.0): nomic-ai/nomic-embed-code via EMBED_MODEL_ID
