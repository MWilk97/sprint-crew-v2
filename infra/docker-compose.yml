# vLLM inference lanes for GX10 (GB10, unified memory).
#   docker compose --profile coder up -d          # lane 8001
#   docker compose --profile work up -d           # lane 8002 (ScrumMaster + TechLead + Reviewer)
#   docker compose --profile all up -d            # coder + work
#   docker compose --profile vector up -d         # qdrant + embed-sidecar

x-vllm-common: &vllm-common
  # Both lanes need this image, for different reasons: Laguna needs vLLM >= 0.25 for the
  # poolside_v1 parsers, and Qwen3.6 needs transformers 5.x for its tokenizer backend
  # (NGC 26.04 ships vLLM 0.19 / transformers 4.57 and fails both).
  image: timothystewart6/vllm-gb10:v0.25.1-gb10.2
  restart: "no"
  ipc: host
  shm_size: "16gb"
  volumes:
    - ${HF_HOME:-${HOME}/vllm-models}:/models
    # Reuse `hf auth login` token (avoids stale placeholder in .env)
    - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
  environment: &vllm-env
    HF_HOME: /models
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    HF_TOKEN: ${HF_TOKEN:-}
    NVIDIA_VISIBLE_DEVICES: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  vllm-coder:
    <<: *vllm-common
    profiles: [coder, all]
    # NVFP4 MoE on GB10 (sm121): force Marlin FP4/FP8 GEMM (FlashInfer FP4 MoE off)
    environment:
      <<: *vllm-env
      VLLM_NVFP4_GEMM_BACKEND: marlin
      VLLM_TEST_FORCE_FP8_MARLIN: "1"
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      CUTE_DSL_ARCH: sm_121a
    ports:
      - "8001:8000"
    command:
      - vllm
      - serve
      - poolside/Laguna-S-2.1-NVFP4
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - laguna-s-2.1-nvfp4
      - --trust-remote-code
      - --tensor-parallel-size
      - "1"
      - --dtype
      - auto
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.85"
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enforce-eager
      - --kv-cache-dtype
      - fp8
      - --enable-auto-tool-choice
      - --tool-call-parser
      - poolside_v1
      # Reasoning parser loaded so per-request enable_thinking:true (coder attempt-based
      # escalation) is stripped into reasoning_content before tool-call parsing.
      # Server default stays thinking OFF; the app opts in per request. See AGENTS.md 8.4.
      - --reasoning-parser
      - poolside_v1
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      # Pin Poolside eval-certified sampling — raw defaults degrade NVFP4 output when a
      # client sends no sampling params (per vLLM recipe). App also sets these per request.
      - --override-generation-config
      - '{"temperature": 0.7, "top_p": 0.95, "top_k": 20}'
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  vllm-work:
    <<: *vllm-common
    profiles: [work, all]
    # Qwen3.6-35B-A3B NVFP4 — natively multimodal (vision tower ships unquantized in
    # model_visual.safetensors). Published DGX Spark recipes pass --language-model-only to
    # reclaim ~900 MB; we must NOT, the Interpreter role needs image input (ADR 0013).
    # NVFP4 MoE on GB10 (sm121): force Marlin FP4/FP8 GEMM (FlashInfer FP4 MoE off)
    environment:
      <<: *vllm-env
      VLLM_NVFP4_GEMM_BACKEND: marlin
      VLLM_TEST_FORCE_FP8_MARLIN: "1"
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    ports:
      - "8002:8000"
    command:
      - vllm
      - serve
      - RedHatAI/Qwen3.6-35B-A3B-NVFP4
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - qwen3.6-35b-a3b-nvfp4
      - --trust-remote-code
      - --tensor-parallel-size
      - "1"
      - --dtype
      - auto
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.65"
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # Qwen3.6 is a Mamba hybrid: prefix caching forces Mamba cache 'align' mode, which
      # asserts block_size (2096) <= max_num_batched_tokens. The 2048 default fails init.
      - --max-num-batched-tokens
      - "8192"
      - --enforce-eager
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      # Qwen3.6 chat template emits <tool_call><function=..><parameter=..>, not the
      # hermes JSON envelope the previous work model used.
      - --tool-call-parser
      - qwen3_coder
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 600s

  qdrant:
    image: qdrant/qdrant:latest
    profiles: [vector]
    restart: "no"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  embed-sidecar:
    build:
      context: ./embed-sidecar
    profiles: [vector]
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      EMBED_MODEL_ID: ${EMBED_MODEL_ID:-jinaai/jina-embeddings-v2-base-code}
      HF_HOME: /models
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

volumes:
  qdrant_data:
