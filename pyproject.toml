[project]
name = "sprint-crew-v2"
version = "0.1.0"
description = "Sprint crew agents: Pydantic AI + LangGraph + vLLM"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.13",
    "pydantic-settings",
    "pydantic-ai[openai]",
    "langgraph",
    "openai",
    "httpx",
    "atlassian-python-api",
    "PyGithub",
    "tiktoken",
    "tree-sitter",
    "tree-sitter-python",
    "sqlite-vec",
    "huggingface-hub",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_crew"]

[tool.pytest.ini_options]
markers = [
    "preflight: live vLLM model probes (opt-in PREFLIGHT_LIVE=1)",
    "live_agent: single agent with mocked IO",
    "live_e2e: full graph with mocked Jira/GitHub",
]
