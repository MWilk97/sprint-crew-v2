[project]
name = "sprint-crew-v2"
version = "0.1.0"
description = "Sprint crew agents: Pydantic AI + LangGraph + vLLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maciej Wilk", email = "maciej.wilk97@gmail.com" }]
keywords = ["llm", "agents", "langgraph", "pydantic-ai", "vllm", "sprint-automation"]
urls = { Repository = "https://github.com/MWilk97/sprint-crew-v2" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.13",
    "pydantic-settings",
    "pydantic-ai[openai]",
    "sse-starlette>=2,<4",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "openai",
    "httpx",
    "atlassian-python-api",
    "PyGithub",
    "pyyaml",
    "qdrant-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_crew"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    # Name is load-bearing: tests/conftest.py::isolate_unit_tests_from_services keys on it
    # to decide whether to force VECTOR_INDEX_ENABLED / CLARIFY_LLM_ENABLED false.
    # Rename both together.
    "agent_live: opt-in e2e gate against real vLLM lanes (VECTOR_AGENT_LIVE=1 VLLM_LIVE=1)",
]
timeout = 1200

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Sample/target repositories the agent operates on — not linted as our source.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
# B and RUF caught a vestigial if/else, stale noqa comments and unused unpacked variables
# that E,F,I,UP miss. Note what they still do NOT catch: dead module-level *constants*
# (four were removed by hand in this cleanup). No ruff rule finds those — F covers unused
# imports and locals only — so that class needs a whole-program tool such as vulture.
select = ["E", "F", "I", "UP", "B", "RUF", "C901"]
# E501: line length is enforced by the formatter. UP042/UP047: generics/StrEnum rewrites we
# do not want. RUF001: the prose in comments and docstrings uses en/em dashes deliberately.
ignore = ["E501", "UP042", "UP047", "RUF001"]

[tool.ruff.lint.mccabe]
# Ratchet, not an aspiration: 23 is today's worst (_build_toolset in tools/pydantic_ai.py).
# Lower it as functions get split; do not raise it to make a new one fit.
max-complexity = 23
