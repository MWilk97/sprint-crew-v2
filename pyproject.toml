[project]
name = "sprint-crew-v2"
version = "0.1.0"
description = "Sprint crew agents: Pydantic AI + LangGraph + vLLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maciej Wilk", email = "maciej.wilk97@gmail.com" }]
keywords = ["llm", "agents", "langgraph", "pydantic-ai", "vllm", "sprint-automation"]
urls = { Repository = "https://github.com/MWilk97/sprint-crew-v2" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.13",
    "pydantic-settings",
    "pydantic-ai[openai]",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "openai",
    "httpx",
    "atlassian-python-api",
    "PyGithub",
    "pyyaml",
    "qdrant-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_crew"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    # Name is load-bearing: tests/conftest.py::disable_vector_index_for_unit_tests keys on it
    # to decide whether to force VECTOR_INDEX_ENABLED=false. Rename both together.
    "agent_live: opt-in e2e gate against real vLLM lanes (VECTOR_AGENT_LIVE=1 VLLM_LIVE=1)",
]
timeout = 1200

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Sample/target repositories the agent operates on — not linted as our source.
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "UP042", "UP047"]
